<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PartyGame 管理后台</title><style>body{font:16px system-ui;background:#111;color:#eee;max-width:1100px;margin:auto;padding:24px}input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}button{cursor:pointer;background:#6246a5}.panel{background:#1d1b23;padding:18px;border-radius:14px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.record{border-top:1px solid #444;padding:12px 0}.muted{color:#aaa}.danger{color:#ff8b8b}</style></head><body><h1>PartyGame 管理后台</h1><section id="login" class="panel"><h2>管理员登录</h2><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button id="signIn">登录</button><p id="loginMsg" class="danger"></p></section><main id="app" hidden><div class="row"><strong id="who"></strong><button id="signOut">退出</button><select id="game"></select><button id="reload">刷新</button></div><section class="panel"><h2>待审核成绩</h2><div id="records">加载中…</div></section><section class="panel"><h2>封禁管理</h2><div class="row"><select id="subjectType"><option value="user">用户 ID</option><option value="device">设备标识</option><option value="ip">IP</option></select><input id="subjectValue" placeholder="封禁对象"><input id="reason" placeholder="原因"><input id="expires" type="datetime-local"><button id="ban">添加封禁</button></div><div id="bans">加载中…</div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.75.0';
const sb=createClient('https://beasxxexggnjcocdbtdl.supabase.co','sb_publishable_85hufMmFQvmLQt2Rz1Hcrw_S4t7BjAO');
const $=id=>document.getElementById(id), games=['reaction','color','math','memory','snake','tank','bomber','dodge','gomoku','xiangqi','chess','go','reversi','chinese_checkers','draughts','doudizhu'];
games.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;$('game').append(o)});
async function load(){const {data:u}=await sb.auth.getUser(); if(!u.user){$('login').hidden=false;$('app').hidden=true;return} $('login').hidden=true;$('app').hidden=false;$('who').textContent=u.user.email; await Promise.all([records(),bans()]);}
async function records(){let q=sb.from('game_records').select('*').order('created_at',{ascending:false}).limit(300);if($('game').value)q=q.eq('game_id',$('game').value);const {data,error}=await q;if(error){$('records').textContent=error.message;return} $('records').innerHTML=(data||[]).map(r=>`<div class="record"><b>${r.game_id}</b> · ${r.player_name} · 分数 ${r.score} · <span class="muted">${r.status} / 风险 ${r.risk_score}</span><br><small>${new Date(r.created_at).toLocaleString()} ${r.risk_flags?.join(',')||''}</small>${r.status==='pending'?`<br><button data-id="${r.id}" data-status="approved">通过</button><button data-id="${r.id}" data-status="rejected">拒绝</button>`:''}</div>`).join('')||'暂无记录';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await sb.from('game_records').update({status:b.dataset.status,reviewed_by:(await sb.auth.getUser()).data.user?.id,reviewed_at:new Date().toISOString()}).eq('id',b.dataset.id);records()})}
async function bans(){const {data,error}=await sb.from('bans').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('bans').textContent=error.message;return}$('bans').innerHTML=(data||[]).map(b=>`<div class="record">${b.subject_type||''}: ${b.subject_value||b.user_id||''} · ${b.reason||''} · ${b.active===false?'已解除':'生效'} <button data-ban="${b.id}">解除</button></div>`).join('')||'暂无封禁';document.querySelectorAll('[data-ban]').forEach(x=>x.onclick=async()=>{await sb.from('bans').update({active:false}).eq('id',x.dataset.ban);bans()})}
$('signIn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginMsg').textContent=error.message;else load()};$('signOut').onclick=()=>sb.auth.signOut().then(load);$('reload').onclick=load;$('game').onchange=records;$('ban').onclick=async()=>{const {error}=await sb.from('bans').insert({subject_type:$('subjectType').value,subject_value:$('subjectValue').value,reason:$('reason').value,expires_at:$('expires').value?new Date($('expires').value).toISOString():null,active:true});if(error)alert(error.message);else bans()};load();
</script></body></html>
