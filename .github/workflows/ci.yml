name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: 规则与协议（JVM + JS 编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 共享规则测试（JVM）
        run: ./gradlew :shared:jvmTest --no-daemon --console=plain
      - name: 共享规则编译（JS）
        run: ./gradlew :shared:compileProductionLibraryKotlinJs --no-daemon --console=plain
      - name: 网页类型检查与单元测试
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          cp ../shared/build/dist/js/productionLibrary/*.mjs src/generated/partycore.mjs 2>/dev/null || true
          npx tsc --noEmit
          node --test tests/*.test.mjs
      - name: 网页构建
        working-directory: web
        run: npm run build

  android:
    name: 安卓构建（assembleDebug）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 安卓单元测试与打包
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: partygame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
